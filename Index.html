
<style>

<script>
function switchTab(tab) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  document.querySelector('.tab-' + tab).classList.add('active');
}

function calcBMI() {
  const h = parseFloat(document.getElementById('bmi-height').value);
  const w = parseFloat(document.getElementById('bmi-weight').value);
  if (!h || !w) return;
  const bmi = w / ((h / 100) ** 2);
  const bmiR = Math.round(bmi * 10) / 10;

  let cat, pct;
  if (bmi < 18.5) { cat = '저체중 ⬇'; pct = Math.max(5, (bmi / 18.5) * 20); }
  else if (bmi < 23) { cat = '정상 ✅'; pct = 20 + ((bmi - 18.5) / 4.5) * 25; }
  else if (bmi < 25) { cat = '과체중 ⚠️'; pct = 45 + ((bmi - 23) / 2) * 25; }
  else { cat = '비만 🔴'; pct = Math.min(95, 70 + ((bmi - 25) / 10) * 25); }

  document.getElementById('bmi-value').textContent = bmiR;
  document.getElementById('bmi-category').textContent = cat;
  document.getElementById('bmi-gauge').style.width = Math.round(pct) + '%';

  const segs = ['seg-under','seg-normal','seg-over','seg-obese'];
  segs.forEach(s => document.getElementById(s).style.border = '2px solid transparent');
  if (bmi < 18.5) document.getElementById('seg-under').style.border = '2px solid #4D96FF';
  else if (bmi < 23) document.getElementById('seg-normal').style.border = '2px solid #40C057';
  else if (bmi < 25) document.getElementById('seg-over').style.border = '2px solid #E8700A';
  else document.getElementById('seg-obese').style.border = '2px solid #FF6B6B';

  document.getElementById('result-bmi').classList.add('visible');
}

function calcBodyFat() {
  const h = parseFloat(document.getElementById('bf-height').value);
  const w = parseFloat(document.getElementById('bf-weight').value);
  const age = parseFloat(document.getElementById('bf-age').value);
  const gender = document.getElementById('bf-gender').value;
  if (!h || !w || !age) return;

  const bmi = w / ((h / 100) ** 2);
  const genderVal = gender === 'male' ? 1 : 0;
  const bf = (1.20 * bmi) + (0.23 * age) - (10.8 * genderVal) - 5.4;
  const bfR = Math.round(bf * 10) / 10;

  let cat, pct;
  const ranges = gender === 'male'
    ? { low: 6, normal: 18, over: 25, obese: 32 }
    : { low: 14, normal: 28, over: 35, obese: 42 };

  if (bf < ranges.low) { cat = '저체지방'; pct = 5; }
  else if (bf < ranges.normal) { cat = '적정 ✅'; pct = 20 + ((bf - ranges.low) / (ranges.normal - ranges.low)) * 30; }
  else if (bf < ranges.over) { cat = '과잉 ⚠️'; pct = 50 + ((bf - ranges.normal) / (ranges.over - ranges.normal)) * 25; }
  else { cat = '비만 🔴'; pct = Math.min(95, 75 + ((bf - ranges.over) / 10) * 20); }

  const fatMass = Math.round(w * bf / 100 * 10) / 10;
  const muscleMass = Math.round((w - fatMass) * 10) / 10;

  document.getElementById('bf-value').textContent = bfR + '%';
  document.getElementById('bf-category').textContent = cat;
  document.getElementById('bf-gauge').style.width = Math.round(pct) + '%';
  document.getElementById('bf-muscle').textContent = muscleMass + ' kg';
  document.getElementById('bf-fat').textContent = fatMass + ' kg';
  document.getElementById('result-bf').classList.add('visible');
}

function calcCalorie() {
  const h = parseFloat(document.getElementById('cal-height').value);
  const w = parseFloat(document.getElementById('cal-weight').value);
  const age = parseFloat(document.getElementById('cal-age').value);
  const gender = document.getElementById('cal-gender').value;
  const activity = parseFloat(document.getElementById('cal-activity').value);
  if (!h || !w || !age) return;

  let bmr;
  if (gender === 'male') bmr = 88.362 + (13.397 * w) + (4.799 * h) - (5.677 * age);
  else bmr = 447.593 + (9.247 * w) + (3.098 * h) - (4.330 * age);

  const tdee = Math.round(bmr * activity);
  const diet = Math.round(tdee * 0.8);
  const bulk = Math.round(tdee * 1.15);
  bmr = Math.round(bmr);

  document.getElementById('cal-value').textContent = tdee.toLocaleString();
  document.getElementById('cal-bmr').textContent = bmr.toLocaleString() + ' kcal';

  const max = bulk;
  document.getElementById('bar-diet').style.width = Math.round(diet / max * 100) + '%';
  document.getElementById('bar-maint').style.width = Math.round(tdee / max * 100) + '%';
  document.getElementById('bar-bulk').style.width = '95%';
  document.getElementById('lbl-diet').textContent = diet.toLocaleString();
  document.getElementById('lbl-maint').textContent = tdee.toLocaleString();
  document.getElementById('lbl-bulk').textContent = bulk.toLocaleString();

  document.getElementById('result-cal').classList.add('visible');
}

function calcIBW() {
  const h = parseFloat(document.getElementById('ibw-height').value);
  const gender = document.getElementById('ibw-gender').value;
  const current = parseFloat(document.getElementById('ibw-current').value);
  const age = parseFloat(document.getElementById('ibw-age').value);
  if (!h) return;

  const base = gender === 'male' ? 22 : 21;
  const ibw = Math.round(base * ((h / 100) ** 2) * 10) / 10;
  const lowW = Math.round(18.5 * ((h / 100) ** 2) * 10) / 10;
  const highW = Math.round(23 * ((h / 100) ** 2) * 10) / 10;

  let diffText = '—';
  let pct = 50;
  if (current) {
    const diff = Math.round((current - ibw) * 10) / 10;
    if (diff > 0) diffText = '+' + diff + ' kg 감량 필요';
    else if (diff < 0) diffText = Math.abs(diff) + ' kg 증량 필요';
    else diffText = '이상 체중 달성! 🎉';

    if (current < lowW) pct = Math.max(5, 25 * current / lowW);
    else if (current <= highW) pct = 25 + ((current - lowW) / (highW - lowW)) * 50;
    else pct = Math.min(95, 75 + ((current - highW) / highW) * 20);
  }

  document.getElementById('ibw-value').textContent = ibw + ' kg';
  document.getElementById('ibw-diff').textContent = diffText;
  document.getElementById('ibw-gauge').style.width = Math.round(pct) + '%';
  document.getElementById('ibw-range').textContent = lowW + ' ~ ' + highW + ' kg';
  document.getElementById('ibw-now').textContent = current ? current + ' kg' : '미입력';
  document.getElementById('result-ibw').classList.add('visible');
}
</script>
